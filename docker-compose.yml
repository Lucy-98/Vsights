# Tuỳ chọn: PostgreSQL 16 cho máy phát triển, nếu không muốn cài PostgreSQL vào máy.
# docker compose up -d   →  localhost:5432, user postgres, mật khẩu bên dưới (chỉ dùng trên máy cá nhân).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres_local_dev
    ports:
      - "5432:5432"
    volumes:
      - vsights_pg:/var/lib/postgresql/data
volumes:
  vsights_pg:
